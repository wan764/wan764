name: Build Windows EXE

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'

jobs:
  build:
    name: Compile sniper.exe (Windows x64)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install mingw-w64 cross-compiler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            gcc-mingw-w64-x86-64 \
            g++-mingw-w64-x86-64 \
            nasm \
            perl

      - name: Build Windows release binary
        env:
          OPENSSL_STATIC: "1"
        run: |
          cargo build --target x86_64-pc-windows-gnu --release

      - name: Upload exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: sniper-windows-x64
          path: target/x86_64-pc-windows-gnu/release/sniper.exe
          retention-days: 30

      - name: Update sniper.exe in repo root
        run: |
          cp target/x86_64-pc-windows-gnu/release/sniper.exe sniper.exe
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sniper.exe
          git diff --cached --quiet || git commit -m "ci: update sniper.exe [skip ci]"
          git push
